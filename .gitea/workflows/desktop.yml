name: Unified desktop build and registry
on:
  push:
    branches: [main, "desktop/macos-app"]
    tags: ["desktop-v*", "macos-v*"]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-arm64
    concurrency:
      group: ${{ startsWith(gitea.ref, 'refs/tags/macos-v') && 'macos-signed-update' || gitea.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install workspace
        run: npx --yes pnpm@10.33.3 install --frozen-lockfile
      - name: Check shared packages and Bridge
        run: |
          npx --yes pnpm@10.33.3 typecheck
          npx --yes pnpm@10.33.3 --dir packages/bridge test
          npx --yes pnpm@10.33.3 test:contracts
          node --test scripts/release/packages.test.mjs
      - name: Build the self-contained macOS installer
        if: ${{ !startsWith(gitea.ref, 'refs/tags/macos-v') }}
        run: npx --yes --package pnpm@10.33.3 -c 'bash scripts/build/macos.sh package'
      - name: Build a signed macOS release
        if: ${{ startsWith(gitea.ref, 'refs/tags/macos-v') }}
        env:
          MAC_RELEASE_REF: ${{ gitea.ref }}
          MAC_SIGN_IDENTITY: ${{ vars.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ vars.MAC_NOTARY_PROFILE }}
          MAC_UPDATE_FEED_URL: https://github.com/Erhao/AgentBridgeLens/releases/download/macos-update-feed/appcast.xml
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          version="$(node -p 'require("./platforms/macos/version.json").version')"
          test "$MAC_RELEASE_REF" = "refs/tags/macos-v$version"
          : "${MAC_SIGN_IDENTITY:?}" "${MAC_NOTARY_PROFILE:?}" "${SPARKLE_PUBLIC_ED_KEY:?}"
          npx --yes --package pnpm@10.33.3 -c 'bash scripts/build/macos.sh package'
      - name: Mount the DMG and verify the installed app through MCP
        env:
          ABL_REQUIRE_SIGNED_UPDATE: ${{ startsWith(gitea.ref, 'refs/tags/macos-v') && '1' || '0' }}
        run: bash scripts/test/macos-dmg.sh
      - name: Create and verify the signed update archive and feed
        if: ${{ startsWith(gitea.ref, 'refs/tags/macos-v') }}
        env:
          MAC_NOTARY_PROFILE: ${{ vars.MAC_NOTARY_PROFILE }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash scripts/release/macos-appcast.sh
      - name: Package standalone Bridge
        run: |
          export PATH="$(dirname "$(command -v node)"):$PATH"
          npx --yes --package pnpm@10.33.3 -c 'bash scripts/build/bundle-bridge.sh artifacts/AgentBridgeLens.app/Contents/Resources'
      - name: Publish immutable registry files and verify downloads
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_REF: ${{ gitea.ref }}
          GITEA_SHA: ${{ gitea.sha }}
          GITEA_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: node scripts/release/packages.mjs
      - name: Publish the in-app update feed
        if: ${{ startsWith(gitea.ref, 'refs/tags/macos-v') }}
        env:
          GH_TOKEN: ${{ secrets.MAC_UPDATE_GITHUB_TOKEN }}
        run: bash scripts/release/publish-macos-feed.sh
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unified-desktop-${{ gitea.sha }}
          path: |
            artifacts/*.dmg
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/BUILD-MANIFEST.json
            artifacts/update/*.zip
            artifacts/update/appcast.xml
