<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentBridgeLens</title>
    <style>
      html, body {
        width: 340px;
        height: 560px;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        padding: 14px;
        color: #1f2933;
        display: flex;
        flex-direction: column;
      }
      #controls {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      /* 让标签页列表占满弹窗剩余高度并独立滚动（高优先级覆盖共享样式的 max-height） */
      body #bl-tablist {
        flex: 1;
        min-height: 80px;
        max-height: none;
      }
    </style>
  </head>
  <body>
    <div id="controls"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
