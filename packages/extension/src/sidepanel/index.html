<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentBridgeLens</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1f2933;
        font-size: 13px;
      }
      #confirm {
        display: none;
        border: 1px solid #ffd79a;
        background: #fff8ec;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
      }
      #confirm p {
        margin: 0 0 8px;
      }
      #confirm .options {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #confirm button {
        flex: 1 0 auto;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background: #4a90d9;
        color: #fff;
        cursor: pointer;
        font-size: 12px;
      }
      #confirm button:hover {
        background: #3a7bc0;
      }
      .sec {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #7b8794;
        margin: 14px 0 6px;
      }
    </style>
  </head>
  <body>
    <div id="confirm">
      <p id="confirm-msg"></p>
      <div class="options" id="confirm-options"></div>
    </div>

    <div id="controls"></div>


    <script type="module" src="./panel.ts"></script>
  </body>
</html>
