name: Extension CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --dir packages/bridge test
      - run: pnpm --dir packages/extension test
      - run: pnpm test:release
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-build-${{ github.sha }}
          path: agentbridgelens-extension.zip
          if-no-files-found: error
          retention-days: 14
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/abl-browser" --no-save --package-lock=false playwright@1.64.1
          node "$RUNNER_TEMP/abl-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify service settings, connection diagnostics and activity cards in Chrome
        env:
          ABL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/abl-browser/node_modules/playwright/index.mjs
        run: |
          node packages/extension/test/service-settings.browser.mjs
          node packages/extension/test/connection-status.browser.mjs
          node packages/extension/test/activity-toast.browser.mjs

  verify-updater:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/update/*.test.mjs

  release:
    needs: [verify, verify-updater]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extension-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-release-${{ github.sha }}
          path: release/
          if-no-files-found: ignore
          retention-days: 30
