name: Windows desktop checks

on:
  push:
    branches: [main]
    paths:
      - 'packages/bridge/**'
      - 'packages/windows-agent/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    paths:
      - 'packages/bridge/**'
      - 'packages/windows-agent/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core invariants (no desktop access)
        run: dotnet run --project packages/windows-agent/tests/Core/Core.csproj
      - name: Compile Windows integration tests
        run: dotnet build packages/windows-agent/tests/Integration/Integration.csproj
      - name: UIA and WGC against isolated fixture windows
        if: matrix.architecture == 'x64'
        run: dotnet run --no-build --project packages/windows-agent/tests/Integration/Integration.csproj
      - name: Publish self-contained executor for the target architecture
        run: >-
          dotnet publish packages/windows-agent/AgentBridgeLens.Windows.csproj
          --configuration Release --runtime win-${{ matrix.architecture }} --self-contained true
          -p:RestoreLockedMode=true --output packages/bridge/windows-agent/win-${{ matrix.architecture }}
      - uses: pnpm/action-setup@v4
        if: matrix.architecture == 'x64'
      - uses: actions/setup-node@v4
        if: matrix.architecture == 'x64'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: matrix.architecture == 'x64'
      - run: pnpm --dir packages/bridge typecheck
        if: matrix.architecture == 'x64'
      - run: pnpm --dir packages/bridge build
        if: matrix.architecture == 'x64'
      - name: Windows protocol and installed executor checks
        if: matrix.architecture == 'x64'
        run: pnpm --dir packages/bridge exec node --test test/windows-desktop.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-win-${{ matrix.architecture }}
          path: packages/bridge/windows-agent/win-${{ matrix.architecture }}/
          if-no-files-found: error
