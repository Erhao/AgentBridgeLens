<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentBridgeLens</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
        color: #1f2933;
      }
      hr {
        border: none;
        border-top: 1px solid #eef1f4;
        margin: 14px 0 10px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #7b8794;
        margin: 0 0 6px;
      }
      .target {
        font-size: 12px;
        background: #eef4fb;
        border-radius: 6px;
        padding: 5px 8px;
        margin-bottom: 8px;
        word-break: break-all;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .row select {
        flex: 1;
        padding: 4px;
        border: 1px solid #cbd2d9;
        border-radius: 5px;
      }
      .row button {
        width: auto;
        margin: 0;
        padding: 4px 8px;
        background: #6b7785;
        font-size: 12px;
      }
      #tablist {
        max-height: 220px;
        overflow: auto;
        border: 1px solid #eef1f4;
        border-radius: 6px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 6px;
        border-bottom: 1px solid #f3f5f7;
        font-size: 12px;
      }
      .tab:last-child {
        border-bottom: none;
      }
      .tab.is-target {
        background: #e3f9e5;
      }
      .tab .meta {
        flex: 1;
        min-width: 0;
      }
      .tab .t {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab .u {
        color: #9aa5b1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab button {
        width: auto;
        margin: 0;
        padding: 3px 7px;
        font-size: 11px;
        flex: 0 0 auto;
      }
      .tab .pin {
        background: #9aa5b1;
        color: #fff;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .status {
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 6px;
        margin-bottom: 12px;
        background: #f0f2f5;
      }
      .status.ok {
        background: #e3f9e5;
        color: #207227;
      }
      .status.bad {
        background: #fff0f0;
        color: #ab1c1c;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 6px;
        margin-top: 3px;
        border: 1px solid #cbd2d9;
        border-radius: 5px;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 7px;
        margin-top: 4px;
        border: none;
        border-radius: 6px;
        background: #4a90d9;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #3a7bc0;
      }
    </style>
  </head>
  <body>
    <h1>AgentBridgeLens</h1>
    <div id="status" class="status">检查连接中…</div>
    <label>
      Host
      <input id="host" type="text" placeholder="127.0.0.1" />
    </label>
    <label>
      Port
      <input id="port" type="number" min="1" max="65535" placeholder="19222" />
    </label>
    <label>
      Token <span style="color:#7b8794">（跨机时必填）</span>
      <input id="token" type="password" placeholder="BRIDGELENS_TOKEN" autocomplete="off" />
    </label>
    <button id="save">保存并重连</button>

    <hr />
    <h2>目标标签页</h2>
    <div id="target" class="target">跟随当前激活标签页</div>
    <div class="row">
      <span>新标签策略</span>
      <select id="policy">
        <option value="stay">不跟随</option>
        <option value="follow">自动跟随目标页新标签</option>
      </select>
      <button id="clear-target">取消固定</button>
    </div>
    <div id="tablist"></div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
