name: Gitea extension checks and GitHub release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: extension-${{ gitea.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --dir packages/bridge test
      - run: pnpm test:contracts
      - run: pnpm --dir packages/extension test
      - run: pnpm test:release
      - run: pnpm test:updater
      - run: pnpm zip
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/abl-browser" --no-save --package-lock=false playwright@1.64.1
          node "$RUNNER_TEMP/abl-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Chrome settings, diagnostics, activity cards and updater regression
        env:
          ABL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/abl-browser/node_modules/playwright/index.mjs
        run: |
          node packages/extension/test/service-settings.browser.mjs
          node packages/extension/test/connection-status.browser.mjs
          node packages/extension/test/activity-toast.browser.mjs
          node scripts/update/update-extension.browser.mjs
      - uses: actions/upload-artifact@v3
        with:
          name: extension-build-${{ gitea.sha }}
          path: agentbridgelens-extension.zip
          if-no-files-found: error
  release:
    needs: verify
    if: gitea.ref == 'refs/heads/main' && gitea.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Publish the extension from Gitea directly to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          git remote set-url origin https://github.com/Erhao/AgentBridgeLens.git
          pnpm exec semantic-release --no-ci
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: extension-release-${{ gitea.sha }}
          path: release/
          if-no-files-found: ignore
